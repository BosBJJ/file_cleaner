{% if error %}
  <p style="color: red;">{{ error }}</p>
{% endif %}

<form method="post">
  <label>
    Folder path:
    <input type="text" name="folder">
  </label>
  <br>

  <label>
    Days:
    <input type="number" name="days">
  </label>
  <br>

  <button type="submit">Scan</button>
</form>

{% if files %}
  <h2>Matching files ({{ files|length }})</h2>
  <ul>
    {% for f in files %}
      <li>{{ f }}</li>
    {% endfor %}
  </ul>
{% endif %}


{% if folder or days %}
  <h2>Submitted values</h2>
  <p>Folder: {{ folder }}</p>
  <p>Days: {{ days }}</p>
{% endif %}
